version: 2
updates:
  # Maintain dependencies in our GitHub Workflows
  - package-ecosystem: github-actions
    directory: /
    groups:
      # group official actions updates
      actions:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "*docker*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: helm # zizmor: ignore[dependabot-cooldown]
    directory: /jhe
    schedule:
      interval: daily
    ignore:
      - dependency-name: ghcr.io/jupyterhealth/jupyterhealth-exchange
        versions:
          - ">= 99999"
      - dependency-name: ghcr.io/jupyterhealth/jupyterhealth-exchange-mcp
        versions:
          - ">= 99999"
