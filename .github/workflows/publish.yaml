name: Publish

# Trigger the workflow on pushed tags or commits to main branch.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
      - "!.github/workflows/publish.yaml"
    branches:
      - "main"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  publish:
    environment: publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # chartpress requires git history to set chart version and image tags
          # correctly
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # don't need buildx setup until/unless we have images to build in the chart
      #       - name: Set up QEMU (for docker buildx)
      #         uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      #
      #       - name: Set up Docker Buildx (for chartpress multi-arch builds)
      #         uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Install chart publishing dependencies (chartpress, helm)
        run: |
          pip install -r requirements.txt
          pip list

          helm version

      - name: build chart with chartpress
        run: |
          chartpress --push --publish-chart

      - name: add to github summary
        run: |
          version="$(cat jhe/Chart.yaml | yq .version)"
          repo="$(cat chartpress.yaml | yq '.charts[0].repo.oci')"
          published="$(cat chartpress.yaml | yq '.charts[0].repo.published')"

          echo "published $repo version: $version at $published" >> "$GITHUB_STEP_SUMMARY"
