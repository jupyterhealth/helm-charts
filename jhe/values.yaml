# Kubernetes stuff
# -- override the name of the deployment
# @default -- "jhe"
nameOverride: ""
# -- override the full name of the deployment
# @default -- "$Name-jhe"
fullnameOverride: ""

# JHE stuff

db:
  # -- postgres db name
  name: postgres
  # -- postgres username
  user: postgres
  # -- postgres password
  password: ""
  # -- postgres server host
  host: ""
  # -- postgres server port
  port: 5432

debug:
  # -- global debug flag (unused)
  enabled: false

# -- image for JHE
image: ghcr.io/jupyterhealth/jupyterhealth-exchange:0.0.15.dev11-g791cce715
imagePullPolicy:

migrate:
  # -- Run `manage.py migrate` as part of JHE startup.
  # -- Typically required.
  enabled: true

# -- Extra arguments to pass to JHE
args: []
# -- Extra volumes to mount
volumeMounts: []
# -- Number of worker processes per JHE replica
workers: 2

# -- Set environment variables for the JHE process
env:
  SITE_TITLE: JupyterHealth Exchange
  SITE_URL: ""
  # allowed_hosts
  # must contain localhost for health check, must also contain .namespace.svc.cluster.local for mcp server
  # ALLOWED_HOSTS: 127.0.0.1,localhost,*.svc.cluster.local

# @ignore
# first-time generate these secret environment variables
_secret_env:
  - OIDC_RSA_PRIVATE_KEY
  - SECRET_KEY

# -- resources for each JHE deployment replica
resources: {}

# -- number of JHE replicas to deploy
replicas: 1

pdb:
  # -- Enable Pod Disruption Budget for JHE
  enabled: false
  # -- Pod Disruption Budget for JHE
  spec:
    maxUnavailable:
    minAvailable: 1

service:
  type: LoadBalancer
  labels: {}
  annotations: {}
  nodePorts:
    http: # @schema type:[integer, null]; minimum:0
    https: # @schema type:[integer, null]; minimum:0
  disableHttpPort: false
  extraPorts: []
  externalIPs: []
  loadBalancerIP:
  loadBalancerSourceRanges: []
  ipFamilyPolicy: PreferDualStack
  ipFamilies: []

httpRoute:
  # -- Expose JHE via Gateway HTTPRoute
  enabled: false
  annotations: {}
  hostnames: []
  gateway:
    name: your-gateway
    namespace: "" # required for a gateway resource in another namespace

ingress:
  # -- Expose JHE via Ingress
  enabled: false
  annotations: {}
  ingressClassName:
  hosts: []
  path: /
  pathSuffix:
  pathType: Prefix
  tls: []
  extraPaths: []

# -- enable liveness probe
livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 13
  timeoutSeconds: 15
  failureThreshold: 3

# -- readiness probe
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 8
  failureThreshold: 3

# -- startup probe (before liveness/readiness start)
startupProbe:
  enabled: true
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 30

mcp:
  # -- mcp server image
  image: ghcr.io/jupyterhealth/jupyterhealth-exchange-mcp:0.0.15.dev11-g791cce715
  # -- enable the mcp server
  enabled: false
  # -- mcp server replicas
  replicas: 1
  # -- mcp server resources
  resources: {}
  # -- mcp server command
  command: # @schema type:[array, null]
  # -- extra args to pass to the mcp server comand
  args: # @schema type:[array, null]
  # -- environment variables for mcp server
  env: {}

  # @ignore
  _secret_env:
    - MCP_BROKER_KEY
    - JHE_CLIENT_ID
    - JHE_CLIENT_SECRET

  service:
    type: LoadBalancer
    labels: {}
    annotations: {}
    nodePorts:
      http: # @schema type:[integer, null]; minimum:0
      https: # @schema type:[integer, null]; minimum:0
    disableHttpPort: false
    extraPorts: []
    externalIPs: []
    loadBalancerIP:
    loadBalancerSourceRanges: []
    ipFamilyPolicy: PreferDualStack
    ipFamilies: []

  # -- Expose MCP Server via Gateway HTTPRoute
  httpRoute:
    enabled: false
    annotations: {}
    hostnames: []
    gateway:
      name: your-gateway
      namespace: "" # required for a gateway resource in another namespace

  # -- Expose MCP Server via Ingress
  ingress:
    enabled: false
    annotations: {}
    ingressClassName:
    hosts: []
    path: /
    pathSuffix:
    pathType: Prefix
    tls: []
    extraPaths: []

  # -- MCP Server liveness probe
  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 13
    timeoutSeconds: 15

  # -- MCP Server readiness probe
  readinessProbe:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 11
    timeoutSeconds: 10

  # -- MCP Server startup probe
  startupProbe:
    enabled: true
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 30

# open-wearables
# adapted from Apache-2.0-licensed
# https://github.com/HomeOpsHub/helm-for-home/tree/e4a195942b794a14a4611f2db3de25f3e541fb3a/charts/stable/open-wearables
# and docker-compose reference:
# https://github.com/the-momentum/open-wearables/blob/fa69264182c637821bb931285f9f67999c99438d/docs/deployment/docker.mdx#example-compose-deployment
openWearables:
  # -- enable open-wearables backend
  enabled: false
  backend:
    replicas: 1
    image: themomentum/open-wearables-backend:0.9
    command:
      - scripts/start/app.sh
    args: []
    env: {}
    # @ignore
    _secret_env:
      - SECRET_KEY

    resources: {}
    service:
      annotations: {}

    livenessProbe:
      enabled: false
      initialDelaySeconds: 5
      periodSeconds: 13
      timeoutSeconds: 15

    readinessProbe:
      enabled: false
      initialDelaySeconds: 3
      periodSeconds: 11
      timeoutSeconds: 10

    startupProbe:
      enabled: false
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 30

  # -----------------------------------------------------------
  # Celery Worker
  # -----------------------------------------------------------
  celery-worker:
    replicas: 1
    # @default -- .Values.openWearables.backend.image
    image: ""
    command:
      - scripts/start/worker.sh
    resources: {}
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false

  # -----------------------------------------------------------
  # Celery Beat (periodic task scheduler)
  # -----------------------------------------------------------
  celery-beat:
    replicas: 1
    # @default -- .Values.openWearables.backend.image
    image: ""
    command:
      - scripts/start/beat.sh
    resources: {}
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false

  redis:
    replicas: 1
    image: valkey/valkey:9-alpine
    command: # @schema type:[array, null]
    args: # @schema type:[array, null]
    env: {}
    resources: {}
    # TODO: persistence
    data: {}
    service:
      annotations: {}

    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false

  # -----------------------------------------------------------
  # Ingress
  # -----------------------------------------------------------

  httpRoute:
    # -- expose openWearables via http route
    enabled: false
    annotations: {}
    hostnames: []
    gateway:
      name: your-gateway
      namespace: "" # required for a gateway resource in another namespace

  ingress:
    # -- expose openWearables via ingress
    enabled: false
    annotations: {}
    ingressClassName:
    hosts: []
    path: /
    pathSuffix:
    pathType: Prefix
    tls: []
    extraPaths: []

# these are only for testing

seed:
  # -- seed the database for testing. This creates an insecure deployment, do not use in production.
  enabled: false
  # -- the helm hook. post-install means this runs exactly one time ever.
  hook: post-install
  args: []

postgres:
  # -- include a temporary postgres database for local testing (NOT FOR PRODUCTION)
  enabled: false
  image: postgres:18
  serviceName: ""
