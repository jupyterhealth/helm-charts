{{- if .Values.openWearables.enabled }}
{{- $service := .Values.openWearables.redis.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jhe.fullname" . }}-ow-redis
  labels:
    {{- include "jhe.labels" . | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: ow-redis
    {{- include "jhe.matchLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP
{{- end }}
