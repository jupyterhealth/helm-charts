{{- if .Values.openWearables.enabled }}
{{- $self := .Values.openWearables.frontend }}
{{- $component := "ow-frontend" }}
{{- $name := printf "%s-%s" (include "jhe.fullname" .) $component }}
{{- $backend := printf "%s-%s" (include "jhe.fullname" .) "ow-backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: {{ $component }}
    {{- include "jhe.labels" . | nindent 4 }}
spec:
  replicas: {{ $self.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
      {{- include "jhe.matchLabels" . | nindent 6 }}
  {{- if .Values.deploymentStrategy }}
  strategy:
    {{- .Values.deploymentStrategy | toYaml | trimSuffix "\n" | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $component }}
        {{- include "jhe.matchLabels" . | nindent 8 }}
      annotations:
        {{- if $self.annotations }}
        {{- $self.annotations | toYaml | trimSuffix "\n" | nindent 8 }}
        {{- end }}
    spec:
      nodeSelector: {{ toJson .Values.nodeSelector }}
      containers:
        - name: frontend
          image: {{ $self.image }}
          {{- with $self.command }}
          command:
            {{- .  | toYaml | trimSuffix "\n" | nindent 12 }}
          {{- end }}
          {{- with $self.args }}
          args:
            {{- .  | toYaml | trimSuffix "\n" | nindent 12 }}
          {{- end }}

          {{- with $self.resources }}
          resources:
            {{- . | toYaml | trimSuffix "\n" | nindent 12 }}
          {{- end }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          env:
            - name: VITE_API_URL
              value: "http://{{ $backend }}:8000"
            {{- range $key, $value := $self.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          {{- if $self.livenessProbe.enabled }}
          livenessProbe:
            {{- include "jhe.probe" $self.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $self.readinessProbe.enabled }}
          readinessProbe:
            {{- include "jhe.probe" $self.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $self.startupProbe.enabled }}
          startupProbe:
            {{- include "jhe.probe" $self.startupProbe | nindent 12 }}
          {{- end }}
{{- end }}
