{{- $self := .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "jhe.fullname" . }}
  labels:
    app.kubernetes.io/component: jhe
    {{- include "jhe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: jhe
      {{- include "jhe.matchLabels" . | nindent 6 }}
  {{- if .Values.deploymentStrategy }}
  strategy:
    {{- .Values.deploymentStrategy | toYaml | trimSuffix "\n" | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: jhe
        {{- include "jhe.matchLabels" . | nindent 8 }}
      annotations:
        # This lets us autorestart when the secret changes!
        checksum/secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/coredata: {{ include (print .Template.BasePath "/configmap-coredata.yaml") . | sha256sum }}
        {{- if .Values.annotations }}
        {{- .Values.annotations | toYaml | trimSuffix "\n" | nindent 8 }}
        {{- end }}
    spec:
      nodeSelector: {{ toJson .Values.nodeSelector }}
      {{- with $self.podSecurityContext }}
      securityContext:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.coreData }}
        - name: coredata
          configMap:
            name: {{ include "jhe.fullname" . }}-coredata
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- .Values.extraVolumes | toYaml | trimSuffix "\n" | nindent 8 }}
        {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- .Values.initContainers | toYaml | trimSuffix "\n" | nindent 8 }}
      {{- end }}
      initContainers:
      {{- if .Values.migrate.enabled }}
        - name: migrate
          image: {{ .Values.image }}
          command:
            - python3
            - manage.py
            - migrate
          {{- with $self.containerSecurityContext }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- . | toYaml | trimSuffix "\n" | nindent 12 }}
          {{- end }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "jhe.fullname" $ }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
        {{- end }}
      containers:
        - name: jhe
          image: {{ .Values.image }}
          command:
            - gunicorn
            - --bind
            - ":8000"
            - --workers
            - {{ .Values.workers | quote }}
            - jhe.wsgi
            {{- if .Values.args }}
            {{- .Values.args  | toYaml | trimSuffix "\n" | nindent 12 }}
            {{- end }}
          {{- with $self.containerSecurityContext }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}

          {{- if (or .Values.volumeMounts .Values.coreData) }}
          volumeMounts:
            {{- range $fileName, $_ := .Values.coreData }}
            - mountPath: /code/core/data/{{ $fileName }}
              name: coredata
              subPath: {{ $fileName | quote }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{ . | toYaml | trimSuffix "\n" | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- . | toYaml | trimSuffix "\n" | nindent 12 }}
          {{- end }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "jhe.fullname" $ }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- if not .Values.env.ALLOWED_HOSTS }}
            - name: ALLOWED_HOSTS
              value: 127.0.0.1,localhost,{{ get (.Values.env.SITE_URL | default "http://localhost" | urlParse) "host" | regexFind "^[^:]+" }},.{{ .Release.Namespace }}.svc.cluster.local
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          {{- if $self.livenessProbe.enabled }}
          livenessProbe:
            {{- include "jhe.probe" $self.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $self.readinessProbe.enabled }}
          readinessProbe:
            {{- include "jhe.probe" $self.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $self.startupProbe.enabled }}
          startupProbe:
            {{- include "jhe.probe" $self.startupProbe | nindent 12 }}
          {{- end }}
