db:
  user: pguser
  name: jhe-test
  password: test-password
  host: jhe-test-postgres

env:
  SITE_URL: http://localhost:8081

service:
  type: ClusterIP

coreData:
  sample.txt: |
    test
    sample
  assetlinks.json:
    - relation:
        - delegate_permission/common.handle_all_urls
      target:
        namespace: android_app
        package_name": "com.jupyter.health"
        sha256_cert_fingerprints:
          - "39:7D:A1:"

ingress:
  enabled: true

mcp:
  enabled: true
  ingress:
    enabled: true
    path: /mcp
  service:
    type: ClusterIP

postgres:
  enabled: true
  serviceName: jhe-test-postgres

seed:
  enabled: true
  hook: post-upgrade
  args:
    - --flush-db
    - --with-rich

readinessProbe:
  # define valid field not in default values
  # make sure passes schema validation
  failureThreshold: 2
