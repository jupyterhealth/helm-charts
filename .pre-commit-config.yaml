repos:
  # Autoformat: Python code, syntax patterns are modernized
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4 # frozen: v3.21.2
    hooks:
      - id: pyupgrade

  # Autoformat: Python code
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 96ae3e5802f3fe2d551e703e18f0a367d1a81ac2  # frozen: 26.10.0
    hooks:
      - id: black

  # Autoformat: Python code
  - repo: https://github.com/pycqa/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # frozen: 9.0.2
    hooks:
      - id: isort
        args:
          - --profile=black

  # Autoformat: markdown, yaml (but not helm templates)
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: ef4a397f916211b4a39ccf9d3d9cbb6562157251  # frozen: v3.9.9
    hooks:
      - id: prettier
        exclude: ".*/(templates/.*|values.schema.json)"

  # Reset Chart.yaml version and values.yaml image tags
  - repo: https://github.com/jupyterhub/chartpress
    rev: 4f07d9b88cc05450552657d4d4c6be5e56db5a07 # frozen: 2.4.0
    hooks:
      - id: chartpress

  # Linting: Python code (see the file .flake8)
  - repo: https://github.com/PyCQA/flake8
    rev: "cfbbfdeb2391c14a37e101e92a77f54f329e1726"  # frozen: 7.4.1
    hooks:
      - id: flake8

  # github actions security checks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --fix=all

  # Autoformat: Bash scripts
  - repo: https://github.com/lovesegfault/beautysh
    rev: 885128fe2600889194c69fa19326cf55a3462777 # frozen: v6.4.3
    hooks:
      - id: beautysh

  # shell scripts
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d # frozen: v0.11.0
    hooks:
      - id: shellcheck

ci:
  autoupdate_schedule: monthly
  skip:
    # pre-commit.ci can't run docker
    - shellcheck
